name: Package

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          submodules: recursive
          token: ${{ secrets.GIT_TOKEN }}

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt update && sudo apt install libglfw3-dev libgl1-mesa-dev libglu1-mesa-dev libfreetype-dev -y

      - name: Install Windows dependencies
        if: runner.os == 'Windows'
        run: vcpkg integrate install && vcpkg install freetype

      - name: Configure CMake (Windows)
        if: runner.os == 'Windows'
        run: cmake . -G="MinGW Makefiles" -DCMAKE_TOOLCHAIN_FILE=C:/vcpkg/scripts/buildsystems/vcpkg.cmake -DCMAKE_BUILD_TYPE=RelWithDebInfo
        working-directory: plugins/J3

      - name: Configure CMake (*nix)
        if: runner.os != 'Windows'
        run: cmake . -DCMAKE_BUILD_TYPE=RelWithDebInfo
        working-directory: plugins/J3

      - name: Compile
        run: cmake --build .
        working-directory: plugins/J3

      - uses: actions/upload-artifact@v7.0.1
        if: runner.os == 'Linux'
        with:
          name: lin_x64
          path: plugins/J3/lin_x64

      - uses: actions/upload-artifact@v7.0.1
        if: runner.os == 'Windows'
        with:
          name: win_x64
          path: plugins/J3/win_x64

      - uses: actions/upload-artifact@v7.0.1
        if: runner.os == 'macOS'
        with:
          name: mac_x64
          path: plugins/J3/mac_x64

  compose:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          path: 'Piper-J3'

      - uses: actions/download-artifact@v8.0.1
        with:
          path: tmp

      - run: |
          mv Piper-J3/.parcelignore .parcelignore
          rm -r Piper-J3/plugins/J3/*_x64
          mkdir Piper-J3/plugins/J3/lin_x64
          mkdir Piper-J3/plugins/J3/win_x64
          mkdir Piper-J3/plugins/J3/mac_x64
          mv tmp/lin_x64/* Piper-J3/plugins/J3/lin_x64
          mv tmp/win_x64/* Piper-J3/plugins/J3/win_x64
          mv tmp/mac_x64/* Piper-J3/plugins/J3/mac_x64
          rm -r tmp

      - uses: slimit75/Parcel@d3f97b3c2ad7e654dd9d56f12492c161eca37e68
        with:
          acf-in-name: 'Piper-J3'